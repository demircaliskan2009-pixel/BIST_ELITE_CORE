[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bist-elite-core"
version = "0.1.0"
description = "BIST Elite Core - Minimal working core for BIST trading"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "requests",
]

[project.scripts]
bist-core = "bist_core.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "fastapi>=0.100.0",
    "build",
]
openai = [
    "openai>=1.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bist_core*", "crypto_core*"]

[tool.ruff.lint]
select = ["E", "F", "W", "S", "B", "I", "C4", "UP"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
# crypto_core: zero tolerance — all rules enforced (no entries here)
# bist_core: legacy code — suppress style/upgrade/bugbear; F and S remain active
"src/bist_core/**" = ["E", "W", "B", "C4", "UP"]
# legacy tests: suppress style/upgrade/bugbear; F and S remain active
"tests/brain/**" = ["E", "W", "B", "C4", "UP"]
"tests/backtest/**" = ["E", "W", "B", "C4", "UP"]
"tests/cli/**" = ["E", "W", "B", "C4", "UP"]
"tests/data/**" = ["E", "W", "B", "C4", "UP"]
"tests/edge/**" = ["E", "W", "B", "C4", "UP"]
"tests/execution/**" = ["E", "W", "B", "C4", "UP"]
"tests/features/**" = ["E", "W", "B", "C4", "UP"]
"tests/fixtures/**" = ["E", "W", "B", "C4", "UP"]
"tests/live/**" = ["E", "W", "B", "C4", "UP"]
"tests/module/**" = ["E", "W", "B", "C4", "UP"]
"tests/ops/**" = ["E", "W", "B", "C4", "UP"]
"tests/risk/**" = ["E", "W", "B", "C4", "UP"]
"tests/services/**" = ["E", "W", "B", "C4", "UP"]
"tests/tools/**" = ["E", "W", "B", "C4", "UP"]
"tests/validation/**" = ["E", "W", "B", "C4", "UP"]
"tests/vendors/**" = ["E", "W", "B", "C4", "UP"]
"tests/*.py" = ["E", "W", "B", "C4", "UP"]
