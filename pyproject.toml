[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bist-elite-core"
version = "0.1.0"
description = "BIST Elite Core - Minimal working core for BIST trading"
requires-python = ">=3.8"
dependencies = [
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bist_core*"]

