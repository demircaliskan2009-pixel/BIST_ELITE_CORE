name: ci

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'poetry.lock'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'poetry.lock'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi
          pytest --version

      - name: Clean compiled artifacts
        run: |
          find . -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache tests/.pytest_cache || true

      - name: Sanity (path & import)
        run: |
          python - <<'PY'
          import sys, importlib.util as iu, os
          print("PYTHONPATH=", os.environ.get("PYTHONPATH"))
          for m in ("bist_core","bist_core.data","bist_core.data.ingest"):
              print(m, "FOUND" if iu.find_spec(m) else "MISSING")
          from bist_core.data import ingest as x
          assert all(hasattr(x,a) for a in ("read_csv","register_dataset","load_registered_dataset"))
          PY

      - name: Run Faz-3 deterministic tests
        run: |
          set -euo pipefail
          pytest -q tests/test_faz3_data_core_ingest_local_csv.py
