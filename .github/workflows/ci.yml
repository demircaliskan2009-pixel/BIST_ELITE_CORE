name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: every Sunday 02:00 UTC — runs full suite including slow tests
    - cron: "0 2 * * 0"

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: error
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt pytest
          else
            python -m pip install pytest
          fi
          python -m pip install ruff

      - name: Agent OS control-plane contract
        run: python scripts/crypto_core/validate_agent_os_v2.py

      - name: Ruff lint
        run: ruff check src/crypto_core tests/crypto_core scripts/crypto_core --output-format=github

      - name: Ruff format check
        run: ruff format --check src/crypto_core tests/crypto_core scripts/crypto_core

      - name: Run pytest
        run: |
          set -euo pipefail
          python -m pytest -q -W error tests/crypto_core

      - name: Coverage report
        run: |
          set -euo pipefail
          python -m pip install pytest-cov
          python -m pytest --cov=src/crypto_core --cov-report=term --cov-fail-under=70 -q tests/crypto_core

  slow-tests:
    name: slow-tests
    # Only run on schedule (weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: error
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt pytest
          else
            python -m pip install pytest
          fi
          python -m pip install pytest-cov ruff

      - name: Run full suite including slow tests
        run: |
          set -euo pipefail
          python -m pytest -q --runslow --cov=src/crypto_core --cov-report=term --cov-fail-under=70

  codeql:
    name: codeql
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:python
