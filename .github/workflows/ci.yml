name: ci

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "requirements*.txt"
      - "pyproject.toml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "requirements*.txt"
      - "pyproject.toml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # src-layout için kritik: Python, 'src' altını paket kökü olarak görsün
      PYTHONPATH: ${{ github.workspace }}/src
      TZ: UTC
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi

      - name: Clean compiled artifacts
        run: |
          find . -name "__pycache__" -type d -print -exec rm -rf {} + || true
          rm -rf .pytest_cache tests/.pytest_cache || true

      - name: Sanity (path check)
        run: |
          python - <<'PY'
          import os, sys, importlib.util, pathlib
          print("PYTHONPATH=", os.environ.get("PYTHONPATH"))
          print("sys.path[0:3]=", sys.path[0:3])
          for m in ("bist_core","bist_core.data","bist_core.data.ingest"):
              spec = importlib.util.find_spec(m)
              print(m, "->", "FOUND" if spec else "MISSING", getattr(spec, "origin", None))
          PY

      - name: Run Faz-3 deterministic tests
        run: |
          set -euo pipefail
          # Ek güvenlik için env satırında da genişletiyoruz
          PYTHONPATH="$PYTHONPATH" pytest -q tests/test_faz3_data_core_ingest_local_csv.py
