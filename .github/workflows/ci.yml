name: ci

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "poetry.lock"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "poetry.lock"

# Aynı ref için paralel workflow’ları iptal et (daha hızlı ve deterministik CI)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Sadece src/ kökü import yoluna eklenir
      PYTHONPATH: ${{ github.workspace }}/src
      # Derlenmiş dosya bırakma (eski .pyc çakışmalarını önlemek için)
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi

      - name: Clean compiled artifacts
        run: |
          find . -name "*.pyc" -delete || true
          find . -name "__pycache__" -type d -exec rm -rf {} + || true

      - name: Sanity (paths & versions)
        run: |
          python -V
          echo "PYTHONPATH=$PYTHONPATH"
          ls -la
          ls -la src || true
          ls -la tests || true

      - name: Run Faz-3 deterministic tests
        run: |
          set -euo pipefail
          # Sadece bu modülün testi: import yolu hatalarını kolay teşhis eder
          pytest -q tests/test_faz3_data_core_ingest_local_csv.py
