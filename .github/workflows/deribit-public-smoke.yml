name: Deribit Public Smoke

# PUBLIC MARKET DATA ONLY. NO CREDENTIALS. NO TRADING. NO SECRETS.
# Manual-only workflow for Deribit public WebSocket smoke proof.
# Does NOT affect normal push/PR CI pipeline.
# Does NOT unlock connector_ready_dialects or operational_status.
# Does NOT require any secrets or API keys.

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "PUBLIC MARKET DATA ONLY capture duration, max 30 seconds"
        required: true
        default: "30"
        type: string
      max_messages:
        description: "PUBLIC MARKET DATA ONLY max messages, max 100"
        required: true
        default: "100"
        type: string
      sample_limit:
        description: "PUBLIC MARKET DATA ONLY sample events to serialize, max 100"
        required: true
        default: "100"
        type: string
      max_receive_lag_ms:
        description: "PUBLIC MARKET DATA ONLY receive lag budget, max 60000"
        required: true
        default: "60000"
        type: string

permissions:
  contents: read

jobs:
  deribit-public-smoke:
    name: deribit-public-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DERIBIT_SMOKE_DURATION_SECONDS: ${{ inputs.duration_seconds || '30' }}
      DERIBIT_SMOKE_MAX_MESSAGES: ${{ inputs.max_messages || '100' }}
      DERIBIT_SMOKE_SAMPLE_LIMIT: ${{ inputs.sample_limit || '100' }}
      DERIBIT_SMOKE_MAX_RECEIVE_LAG_MS: ${{ inputs.max_receive_lag_ms || '60000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Deribit public WS smoke
        run: |
          set -euo pipefail
          python scripts/crypto_core/deribit_public_ws_smoke.py \
            --authorization PUBLIC_MARKET_DATA_ONLY \
            --duration-seconds "$DERIBIT_SMOKE_DURATION_SECONDS" \
            --max-messages "$DERIBIT_SMOKE_MAX_MESSAGES" \
            --sample-limit "$DERIBIT_SMOKE_SAMPLE_LIMIT" \
            --max-receive-lag-ms "$DERIBIT_SMOKE_MAX_RECEIVE_LAG_MS" \
            > smoke_result.json

      - name: Validate smoke result
        run: |
          set -euo pipefail
          python - <<'EOF'
          import json, sys
          with open("smoke_result.json") as f:
              result = json.load(f)
          accepted = result.get("accepted", False)
          msg_count = result.get("message_count", 0)
          rejections = result.get("rejection_reasons", [])
          print(f"accepted={accepted} message_count={msg_count} rejection_reasons={rejections}")
          if not accepted:
              print("SMOKE PROOF FAILED:", rejections, file=sys.stderr)
              sys.exit(1)
          print("SMOKE PROOF ACCEPTED")
          EOF

      - name: Upload smoke proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deribit-public-smoke-proof
          path: smoke_result.json
          retention-days: 90
