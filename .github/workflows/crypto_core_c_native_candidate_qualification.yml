name: crypto-core C native candidate qualification

on:
  pull_request:
    paths:
      - "scripts/crypto_core/qualification/c_*.py"
      - "scripts/crypto_core/qualification/c_rfc3161_backend.c"
      - "scripts/crypto_core/qualification/c_rfc3161_test_vectors.c"
      - "tests/crypto_core/validation/test_c_native_*.py"
      - ".github/workflows/crypto_core_c_native_candidate_qualification.yml"

permissions:
  contents: read

jobs:
  qualify:
    name: candidate-only-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      C_REQUIRE_NATIVE: "1"
      PYTHONPATH: .
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prove exact candidate checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: supranational/blst
          ref: 54e6e55674722fc2797ebb4bbb71b26d881eb4b8
          path: tmp/blst-source
          persist-credentials: false
      - name: Provision pinned qualification test tools
        run: python -m pip install pytest==9.0.3 PyNaCl==1.6.2 cffi==2.0.0 pycparser==2.23
      - name: Acquire previously authenticated exact OpenSSL source
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz --output "${RUNNER_TEMP}/openssl-3.5.9.tar.gz"
          python -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"openssl-3.5.9.tar.gz"; assert hashlib.sha256(p.read_bytes()).hexdigest()=="603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"'
      - name: Build fresh Linux candidate binaries
        if: runner.os == 'Linux'
        shell: bash
        run: python -m scripts.crypto_core.qualification.c_build_candidates --openssl-archive "$RUNNER_TEMP/openssl-3.5.9.tar.gz" --blst-checkout tmp/blst-source --output "$RUNNER_TEMP/c-native-build"
      - name: Build fresh Windows candidate binaries
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          if "%VSPATH%"=="" exit /b 1
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "PATH=C:\Program Files\NASM;C:\Strawberry\perl\bin;%PATH%"
          python -m scripts.crypto_core.qualification.c_build_candidates --openssl-archive "%RUNNER_TEMP%/openssl-3.5.9.tar.gz" --blst-checkout tmp/blst-source --output "%RUNNER_TEMP%/c-native-build"
      - name: Generate disposable synthetic signed vectors
        shell: bash
        run: python -m scripts.crypto_core.qualification.c_rfc3161_vectors --receipt "$RUNNER_TEMP/c-native-build/build-receipt.json" --output "$RUNNER_TEMP/c-native-vectors"
      - name: Run per-platform native tests
        shell: bash
        run: |
          export C_NATIVE_BUILD_RECEIPT="$RUNNER_TEMP/c-native-build/build-receipt.json"
          export C_RFC3161_VECTORS="$RUNNER_TEMP/c-native-vectors/vectors.json"
          python -m pytest -q tests/crypto_core/validation/test_c_native_qualification.py tests/crypto_core/validation/test_c_native_runtime.py --junitxml=tmp/c-native-results.xml
      - name: Upload candidate evidence, excluding all disposable keys
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: CANDIDATE_TEST_EVIDENCE_ONLY-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/c-native-build/build-receipt.json
            ${{ runner.temp }}/c-native-build/c_rfc3161.*
            ${{ runner.temp }}/c-native-build/c_blst.*
            tmp/c-native-results.xml
            ${{ runner.temp }}/c-native-vectors/*.der
            ${{ runner.temp }}/c-native-vectors/vectors.json
          if-no-files-found: error
          retention-days: 14
