name: crypto_core mt4-s3c trusted attestation

# TRUSTED DEFAULT-BRANCH STAGE-C GATE FOR MT4-S3C P0 QUALIFICATION EVIDENCE.
#
# ARCHITECTURE: MT4-S3C-P0-STATIC-WORKER-QUALIFICATION-INFRA-V9, SECTIONS 10, 24, 25, 26, 38.
#
# THIS IS THE ONLY TRUST BOUNDARY IN THE DESIGN.  It is triggered exclusively by workflow_run
# restricted to the default branch, which is the boundary that matters: GitHub only runs a
# workflow_run workflow from the DEFAULT BRANCH definition, so an open pull request can never
# define, alter or reach the authority granted here.
#
# Consequence, and it is intentional: while the pull request that introduces this file is open, this
# workflow DOES NOT RUN.  Its first execution can only happen after merge, when a maintainer
# dispatches the qualification workflow on the default branch.  Pre-merge status is therefore:
#
#   MT4_S3C_TRUSTED_STAGE_C_EXECUTION=POST_MERGE_REQUIRED
#
# No workaround exists here to make it run earlier, and none may be added.
#
# THE PRE-GATE IMPORT ESCAPE, AND HOW THE STEP ORDER CLOSES IT.
#
# A trusted gate whose bytes are verified and then left alone while OTHER steps run is not actually
# pinned.  An interposed step that executes checkout-context code -- most sharply a `python3 -`
# helper, whose sys.path[0] is the working directory -- could import a checkout sibling named
# json.py, hashlib.py or subprocess.py, could rewrite the gate file, could mutate cross-step state
# and could poison the invocation values BETWEEN the measurement and the use.  The frozen invariant
# is therefore CONTIGUITY:
#
#   FINAL_GATE_BYTES_VERIFIED -> (no checkout-controlled execution) -> EXACT_ISOLATED_INVOCATION
#
# and it is enforced STRUCTURALLY, by putting the final verification and the invocation in the SAME
# step with nothing but frozen echo markers between them.  There is no step boundary left to
# interpose at.  Every preparatory step -- the pinned checkout, the pinned interpreter setup, the
# pinned artifact download and the source-bundle inventory -- runs BEFORE that measurement, so any
# tamper they could perform is caught BY it rather than slipping in behind it.  No step in this
# workflow runs an interpreter over checkout-supplied code, sources a checkout script, uses a
# repo-local action, or writes GITHUB_ENV or GITHUB_PATH; the bundle inventory is built with git
# and sha256sum alone.
#
# THE QUALIFICATION WORKFLOW IS UNPRIVILEGED AND PULL-REQUEST-EDITABLE, so its receipt is NOT
# trusted on its own.  mt4_s3c_trusted_attestation_gate.py independently re-derives every digest,
# re-reads artifact identity from the artifact service under complete pagination with the governed
# total_count reconciliation, recomputes the qualification source bundle digest and the compile
# dependency inventory digest, RECONSTRUCTS the canonical internal policy and its cBPF program from
# its OWN frozen constants, RECONSTRUCTS the canonical 25-case inventory and its case-set digest,
# and recomputes every per-case internal filter equivalence digest so that
# A3 == A4 == STAGE_C_RECOMPUTED against Stage-C's own authority.  Unprivileged B2 is never the
# final authority, and no value carried by A3 or A4 is ever adopted as an expected value.
#
# THIS WORKFLOW GRANTS NOTHING.  A passing Stage-C predicate is ADMISSION_EVIDENCE_ONLY.  It creates
# no governed worker row, no custody artifact, no readiness or connector transition, no
# machine-time authority, no MT-5, no MT-6 and no Stage-4 completion.

on:
  workflow_run:
    workflows:
      - crypto_core mt4-s3c static worker qualification
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

env:
  ACTIONS_CHECKOUT_COMMIT: 11d5960a326750d5838078e36cf38b85af677262
  ACTIONS_SETUP_PYTHON_COMMIT: a26af69be951a213d495a4c3e4e4022e16d87065
  ACTIONS_DOWNLOAD_ARTIFACT_COMMIT: 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c

  QUALIFICATION_WORKFLOW_PATH: .github/workflows/crypto_core_mt4_s3c_static_worker_qualification.yml
  QUALIFICATION_WORKFLOW_NAME: crypto_core mt4-s3c static worker qualification
  TRUSTED_GATE_PATH: scripts/crypto_core/qualification/mt4_s3c_trusted_attestation_gate.py

  # APPROVED CONSTANTS.  Deliberately stored HERE, on the trusted surface, and never inside the
  # qualification workflow or the source bundle itself: a self-referential digest could not exist,
  # and a candidate-reported digest could be forged.  The thing being measured therefore cannot
  # change the measuring constant.  If a later pull request edits the qualification workflow, the
  # gate source or any bundle entry, trusted attestation fails closed until a separately reviewed
  # change to the default branch updates the corresponding constant below.
  APPROVED_S3C_QUALIFICATION_WORKFLOW_SHA256: "93e6fee0db033574c25838365cbe42b18e21bab988c10db3b1c2719801d56886"
  APPROVED_S3C_QUALIFICATION_SOURCE_BUNDLE_SHA256: "6a873371af38cc153f2d2bec8499f46d44ce7e91be8fe97a8493a0d405768709"
  APPROVED_S3C_TRUSTED_GATE_SHA256: "065f9082512a3846f3bd6f0741d1d223a358b777fd2c178be6f2d3361abd9bba"

  # EM-11: the identical literal expected program-header authority the reviewed ELF qualifier and
  # the qualification workflow both carry, now including the frozen p_align of every segment.
  # Pinned here so a THIRD non-candidate authority agrees.
  S3C_EXPECTED_PHDR_INVENTORY: "PT_LOAD:5:0x1000,PT_LOAD:6:0x1000,PT_GNU_STACK:6:0x10"

  # The governed __blst_platform_cap object identity, pinned on the trusted surface exactly as V9
  # SECTION 30 rule Q5 requires.  The candidate symbol table is compared AGAINST these values, and
  # the binding and visibility are EXACT: a lowered STB_LOCAL or an STV_INTERNAL object is rejected.
  S3C_BLST_PLATFORM_CAP_SIZE_BYTES: "4"
  S3C_BLST_PLATFORM_CAP_BINDING: "STB_GLOBAL"
  S3C_BLST_PLATFORM_CAP_VISIBILITY: "STV_HIDDEN"

jobs:
  s3c-attest-trusted-evidence:
    name: s3c-attest-trusted-evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Fail closed on the source run's identity BEFORE any credential-bearing step exists.  Only a
    # successful, default-branch, workflow_dispatch run of this repository's own qualification
    # workflow may be attested.  No fork, no pull request, no arbitrary branch and no
    # operator-supplied run id: the source run is exactly github.event.workflow_run.id.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the trusted qualification source at the source-run head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Prove the checkout is the exact source-run head on the default branch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trusted"
          git rev-parse HEAD > "${RUNNER_TEMP}/trusted/head.txt"
          ACTUAL_HEAD=""
          read -r ACTUAL_HEAD _ < "${RUNNER_TEMP}/trusted/head.txt"
          echo "S3C_TRUSTED_SOURCE_HEAD_EXPECTED=${EXPECTED_HEAD}"
          echo "S3C_TRUSTED_SOURCE_HEAD_ACTUAL=${ACTUAL_HEAD}"
          if [ "${ACTUAL_HEAD}" != "${EXPECTED_HEAD}" ]; then
            echo "S3C_TRUSTED_SOURCE_HEAD_MISMATCH"
            exit 1
          fi
          if [ "${SOURCE_BRANCH}" != "main" ]; then
            echo "S3C_TRUSTED_SOURCE_BRANCH_NOT_DEFAULT"
            exit 1
          fi
          echo "S3C_TRUSTED_SOURCE_BINDING=PASS"

      # PREPARATION RUNS FIRST AND IS MEASURED AFTERWARDS.  The interpreter setup and the artifact
      # download are pinned first-party actions, they execute nothing from the checkout, and they
      # write only under RUNNER_TEMP.  Placing them BEFORE the final gate measurement means that
      # even a hypothetical path-traversing artifact member reaching the workspace would be caught
      # by that measurement.
      - name: Setup the trusted Python interpreter
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Fresh-download the compile dependency inventory from the source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: mt4-s3c-compile-dependency-inventory
          path: ${{ runner.temp }}/trusted/dependency
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The qualification source bundle inventory is built HERE, inside the trust boundary, from the
      # GIT OBJECT STORE at the proven source head, using ONLY git and sha256sum.  Committed bytes
      # are used rather than working-tree bytes because checkout line-ending rewriting would make
      # working-tree digests platform-dependent.  NO interpreter is run over checkout-supplied code:
      # the previous `python3 -` helper was itself a pre-gate import surface and is removed.  The
      # sixteen paths are WORKFLOW LITERALS on this trusted surface, never read from the checkout.
      - name: Build the qualification source bundle inventory from the git object store
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trusted"
          BUNDLE_INVENTORY="${RUNNER_TEMP}/trusted/source_bundle_inventory.json"
          LISTING_FILE="${RUNNER_TEMP}/trusted/bundle_listing.txt"
          BLOB_FILE="${RUNNER_TEMP}/trusted/bundle_blob.bin"
          BLOB_SHA_FILE="${RUNNER_TEMP}/trusted/bundle_blob.sha"
          printf '{"entries":[' > "${BUNDLE_INVENTORY}"
          SEPARATOR=""
          ENTRY_COUNT=0
          while IFS= read -r ENTRY_PATH; do
            if [ -z "${ENTRY_PATH}" ]; then
              continue
            fi
            git ls-tree HEAD -- "${ENTRY_PATH}" > "${LISTING_FILE}"
            ENTRY_MODE=""
            ENTRY_KIND=""
            ENTRY_OBJECT=""
            LISTED_PATH=""
            read -r ENTRY_MODE ENTRY_KIND ENTRY_OBJECT LISTED_PATH < "${LISTING_FILE}"
            if [ "${LISTED_PATH}" != "${ENTRY_PATH}" ]; then
              echo "S3C_SOURCE_BUNDLE_PATH_MISSING"
              exit 1
            fi
            if [ "${ENTRY_KIND}" != "blob" ]; then
              echo "S3C_SOURCE_BUNDLE_TYPE_INVALID"
              exit 1
            fi
            if [ "${ENTRY_MODE}" != "100644" ] && [ "${ENTRY_MODE}" != "100755" ]; then
              echo "S3C_SOURCE_BUNDLE_MODE_INVALID"
              exit 1
            fi
            git cat-file blob "${ENTRY_OBJECT}" > "${BLOB_FILE}"
            sha256sum "${BLOB_FILE}" > "${BLOB_SHA_FILE}"
            ENTRY_SHA256=""
            read -r ENTRY_SHA256 _ < "${BLOB_SHA_FILE}"
            printf '%s{"mode":"%s","path":"%s","sha256":"%s","type":"blob"}' \
              "${SEPARATOR}" "${ENTRY_MODE}" "${ENTRY_PATH}" "${ENTRY_SHA256}" >> "${BUNDLE_INVENTORY}"
            SEPARATOR=","
            ENTRY_COUNT=$((ENTRY_COUNT + 1))
          done <<'S3C_SOURCE_BUNDLE_PATHS'
          .github/workflows/crypto_core_mt4_s3c_static_worker_qualification.yml
          scripts/crypto_core/qualification/s3c/mt4_s3c_blst_capability.c
          scripts/crypto_core/qualification/s3c/mt4_s3c_build_manifest.py
          scripts/crypto_core/qualification/s3c/mt4_s3c_elf_qualify.py
          scripts/crypto_core/qualification/s3c/mt4_s3c_observation_adjudicator.py
          scripts/crypto_core/qualification/s3c/mt4_s3c_observation_parser.py
          scripts/crypto_core/qualification/s3c/mt4_s3c_outer_containment_launcher.c
          scripts/crypto_core/qualification/s3c/mt4_s3c_protocol_qualifier.py
          scripts/crypto_core/qualification/s3c/mt4_s3c_receipt_generator.py
          scripts/crypto_core/qualification/s3c/mt4_s3c_sandbox_policy.c
          scripts/crypto_core/qualification/s3c/mt4_s3c_sandbox_policy_probe.c
          scripts/crypto_core/qualification/s3c/mt4_s3c_sandbox_policy_qualifier.py
          scripts/crypto_core/qualification/s3c/mt4_s3c_static_worker_bootstrap.c
          scripts/crypto_core/qualification/s3c/mt4_s3c_static_worker_start.S
          scripts/crypto_core/qualification/s3c/mt4_s3c_static_worker_verify.c
          tests/crypto_core/fixtures/mt4_s3c_test_only_positive_vector_v1.json
          S3C_SOURCE_BUNDLE_PATHS
          printf ']}' >> "${BUNDLE_INVENTORY}"
          if [ "${ENTRY_COUNT}" != "16" ]; then
            echo "S3C_SOURCE_BUNDLE_ENTRY_COUNT_INVALID"
            exit 1
          fi
          echo "S3C_SOURCE_BUNDLE_INVENTORY=PASS"

      # THE CONTIGUOUS TRANSITION (V9 SECTION 26.2, closing the pre-gate escape).
      #
      # Everything security-critical to the invocation is validated FIRST, then the gate bytes are
      # measured, then the gate RUNS.  Between the measurement and the run there is nothing but two
      # frozen echo markers: no step boundary, no interpreter, no checkout file, no cross-step
      # state lookup and no command substitution.
      #
      # An ABSOLUTE interpreter path from the pinned setup action's recorded output -- a bare
      # `python` or `python3` token is FORBIDDEN because PATH resolution is an uncontrolled lookup
      # -- and the path is additionally proven absolute, executable and OUTSIDE the checkout before
      # the measurement.  -I is isolated mode.  -S prevents site, and therefore prevents
      # sitecustomize and usercustomize from executing at all.  The gate path is ABSOLUTE, formed
      # from the workspace root plus the exact committed relative path.  The environment is exactly
      # the sanitized allowlist below, and the gate re-proves all of that about itself before it
      # touches any untrusted byte.
      - name: Verify the trusted gate bytes and run the Stage-C gate in one contiguous transition
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "${GITHUB_WORKSPACE}" in
            /*) ;;
            *) echo "S3C_TRUSTED_WORKSPACE_NOT_ABSOLUTE" ; exit 1 ;;
          esac
          case "${RUNNER_TEMP}" in
            /*) ;;
            *) echo "S3C_TRUSTED_RUNNER_TEMP_NOT_ABSOLUTE" ; exit 1 ;;
          esac
          case "${TRUSTED_PYTHON}" in
            /*) ;;
            *) echo "S3C_TRUSTED_PYTHON_NOT_ABSOLUTE" ; exit 1 ;;
          esac
          case "${TRUSTED_PYTHON}" in
            "${GITHUB_WORKSPACE}"/*) echo "S3C_TRUSTED_PYTHON_INSIDE_CHECKOUT" ; exit 1 ;;
            *) ;;
          esac
          if [ ! -x "${TRUSTED_PYTHON}" ]; then
            echo "S3C_TRUSTED_PYTHON_NOT_EXECUTABLE"
            exit 1
          fi
          if [ ! -f "${RUNNER_TEMP}/trusted/source_bundle_inventory.json" ]; then
            echo "S3C_TRUSTED_BUNDLE_INVENTORY_MISSING"
            exit 1
          fi
          if [ ! -f "${RUNNER_TEMP}/trusted/dependency/compile_dependency_inventory.json" ]; then
            echo "S3C_TRUSTED_DEPENDENCY_INVENTORY_MISSING"
            exit 1
          fi
          sha256sum "${GITHUB_WORKSPACE}/${TRUSTED_GATE_PATH}" > "${RUNNER_TEMP}/trusted/gate.sha"
          ACTUAL_GATE_SHA256=""
          read -r ACTUAL_GATE_SHA256 _ < "${RUNNER_TEMP}/trusted/gate.sha"
          echo "S3C_TRUSTED_GATE_SHA256_ACTUAL=${ACTUAL_GATE_SHA256}"
          if [ "${ACTUAL_GATE_SHA256}" != "${APPROVED_S3C_TRUSTED_GATE_SHA256}" ]; then
            echo "S3C_TRUSTED_GATE_DIGEST_NOT_APPROVED"
            exit 1
          fi
          echo "S3C_TRUSTED_GATE_DIGEST=PASS"
          echo "S3C_TRUSTED_GATE_CONTIGUOUS_TRANSITION=ENTERED"
          env -i \
            GITHUB_TOKEN="${GITHUB_TOKEN}" \
            GITHUB_API_URL="${GITHUB_API_URL}" \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            "${TRUSTED_PYTHON}" -I -S "${GITHUB_WORKSPACE}/${TRUSTED_GATE_PATH}" \
              --workspace-root "${GITHUB_WORKSPACE}" \
              --trusted-entrypoint "${APPROVED_S3C_TRUSTED_GATE_SHA256}:${GITHUB_WORKSPACE}/${TRUSTED_GATE_PATH}" \
              --work-dir "${RUNNER_TEMP}/trusted" \
              --api-url "${GITHUB_API_URL}" \
              --repository "${GITHUB_REPOSITORY}" \
              --source-run-id "${SOURCE_RUN_ID}" \
              --expected-head-sha "${SOURCE_HEAD_SHA}" \
              --expected-workflow-path "${QUALIFICATION_WORKFLOW_PATH}" \
              --expected-workflow-name "${QUALIFICATION_WORKFLOW_NAME}" \
              --approved-qualification-workflow-sha256 "${APPROVED_S3C_QUALIFICATION_WORKFLOW_SHA256}" \
              --approved-source-bundle-sha256 "${APPROVED_S3C_QUALIFICATION_SOURCE_BUNDLE_SHA256}" \
              --source-bundle-inventory "${RUNNER_TEMP}/trusted/source_bundle_inventory.json" \
              --compile-dependency-inventory "${RUNNER_TEMP}/trusted/dependency/compile_dependency_inventory.json" \
              --compile-instance-inventory "${RUNNER_TEMP}/trusted/dependency/compile_instance_inventory.json" \
              --default-branch main \
              --out "${RUNNER_TEMP}/trusted/mt4_s3c_trusted_predicate.json"
          echo "S3C_TRUSTED_GATE_RESULT=PASS"

      # The predicate is EVIDENCE, not authority.  No attestation, no signing, no governed worker
      # row and no admission decision happens in this workflow, and none may be added to it without
      # a separately authorized and separately audited architecture slice.
      - name: Report the trusted Stage-C predicate as evidence only
        shell: bash
        run: |
          set -euo pipefail
          echo "MT4_S3C_TRUSTED_PREDICATE=ADMISSION_EVIDENCE_ONLY"
          echo "MT4_S3C_GOVERNED_WORKER_ROW_CREATED=false"
          echo "MT4_S3C_READINESS_TRANSITION=NONE"
          echo "MT4_S3C_CONNECTOR_TRANSITION=NONE"
          echo "MT4_S3C_MACHINE_TIME_AUTHORITY=NONE"
          echo "MT4_S3C_STAGE4_AUTHORITY=NONE"
