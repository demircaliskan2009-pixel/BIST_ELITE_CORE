services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      # Required (fail-closed): set in your shell or .env
      BIST_GATEWAY_API_KEY: ${BIST_GATEWAY_API_KEY:?set_BIST_GATEWAY_API_KEY}
      # Optional
      BIST_GATEWAY_RPM: ${BIST_GATEWAY_RPM:-60}
      # PACK7 audit log path inside container
      BIST_GATEWAY_AUDIT_LOG: /data/audit.log
    volumes:
      - bist_gateway_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  bist_gateway_data:
